name: pixel_art_app
description: "Pixel Art - Color by Number"
publish_to: 'none'
version: 1.0.10+17 
environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  image: ^4.0.17
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  google_mobile_ads: ^4.0.0
  in_app_purchase: ^3.1.7
  share_plus: ^7.1.0
  in_app_review: ^2.0.9
  in_app_update: ^4.2.3
  url_launcher: ^6.2.0
  image_picker: ^1.0.4
  uuid: ^4.1.0
  collection: ^1.18.0
  firebase_core: ^2.27.0
  firebase_analytics: ^10.8.0
  firebase_remote_config: ^4.3.8
  package_info_plus: ^9.0.1
  audioplayers: ^6.7.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1
  firebase_crashlytics: ^3.5.7
  vibration: ^3.2.0
  sensors_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/pixel_art/
    - assets/pixel_art_devotional/
    - assets/pixel_art_anime/
    - assets/pixel_art_pixelcalm/
    - assets/pixel_art_diamond/
    - assets/icons/
    - assets/audio/
  shaders:
    - shaders/gem_grid.frag
