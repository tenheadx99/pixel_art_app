<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color by Number - Pixel Art</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1a1a2e;
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #a0a0c0; font-size: 14px; margin-bottom: 24px; line-height: 1.4; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff007f, #8a2be2);
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 15px;
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.03); }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 52px; margin-bottom: 12px;">🎨</div>
    <h1 id="app-title">Color by Number</h1>
    <p id="app-desc">Relax and color beautiful pixel artworks with your friends!</p>
    <a id="download-btn" class="btn" href="https://play.google.com/store/apps/details?id=com.tenhead.pixelyart">
      Open / Download on Google Play
    </a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const flavor = params.get('flavor') || 'original';
    const artId = params.get('id');

    const flavorPackages = {
      'devotional': { name: 'Bhakti Rang: Color by Number', pkg: 'com.tenhead.divinepixels' },
      'anime': { name: 'Anime Pixels', pkg: 'com.tenhead.animepixels' },
      'diamond': { name: 'Gem Art', pkg: 'com.tenhead.gemart' },
      'pixelcalm': { name: 'PixelCalm', pkg: 'com.tenhead.pixelcalm' },
      'stitch': { name: 'Cross Stitch', pkg: 'com.tenhead.craftcolor' },
      'bible': { name: 'Daily Bible', pkg: 'com.tenhead.bible' },
      'original': { name: 'Pixely: Color by Number', pkg: 'com.tenhead.pixelyart' }
    };

    const config = flavorPackages[flavor] || flavorPackages['original'];
    document.getElementById('app-title').textContent = config.name;
    const storeUrl = `https://play.google.com/store/apps/details?id=${config.pkg}`;
    document.getElementById('download-btn').href = storeUrl;

    if (/Android/i.test(navigator.userAgent) && artId) {
      window.location.href = `pixely://art?id=${encodeURIComponent(artId)}`;
      setTimeout(() => {
        window.location.href = storeUrl;
      }, 1500);
    }
  </script>
</body>
</html>
